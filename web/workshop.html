<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232ee584'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="零件库：STL/GLB/GLTF/OBJ 电池模型本地导入与预览，工作流第一步。" />
    <title>零件库 · 报废电池拆解数字孪生</title>
  </head>
  <body>
    <header id="site-nav"></header>
    <div class="ambient" aria-hidden="true"><div class="grid-bg"></div><div class="orb orb-b"></div></div>

    <h1 class="sr-only">零件库</h1>
    <main class="page-shell parts">
      <!-- 左：零件列表 + 导入 -->
      <aside class="pt-left col-stack">
        <section class="hud-panel hud-card pt-card">
          <h2 class="hud-title">零件列表</h2>
          <ul class="part-list" id="part-list"></ul>
        </section>
        <section class="hud-panel hud-card pt-card">
          <h2 class="hud-title">导入</h2>
          <button type="button" class="btn-solid pt-import" id="import-btn">从本地导入电池模型</button>
          <input type="file" id="import-file" accept=".stl,.glb,.gltf,.obj" multiple hidden />
          <p class="t-lo pt-hint">支持 STL / GLB / GLTF / OBJ（本地解析，不上传服务器）<br/>
          STEP 格式请先用 CAD 导出为 GLB/STL 后导入</p>
        </section>
        <section class="hud-panel hud-card pt-card">
          <h2 class="hud-title">应用到场景</h2>
          <button type="button" class="btn-ghost pt-apply" id="apply-btn">投放到仿真工作台</button>
          <p class="t-lo pt-hint">选中零件投放至仿真场景的放置位（场景尺寸定稿后开放，当前记录选择）</p>
        </section>
      </aside>

      <!-- 右：预览视口 -->
      <section class="hud-panel pt-view">
        <div id="part-3d" aria-label="零件预览视口"></div>
        <div class="vp-tag">3D 预览（左键旋转 · 滚轮缩放）</div>
        <div class="pt-meta" id="part-meta"></div>
      </section>
    </main>

    <script type="module" src="/src/workshop.ts"></script>
  </body>
</html>
