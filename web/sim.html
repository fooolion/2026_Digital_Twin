<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232ee584'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>仿真规划 · 报废电池拆解数字孪生</title>
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #0a1220; }
      body { font-family: 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
      canvas { display: block; }
      #hud, #tip { pointer-events: none; } /* 覆盖层不拦截指针，避免形成交互死区 */
      #hud {
        position: fixed; top: 72px; left: 16px; z-index: 10; /* 72 = 导航高 56 + 16 */
        padding: 12px 16px 12px 18px; border-radius: 4px;
        background: linear-gradient(180deg, rgba(13, 42, 79, 0.85), rgba(10, 26, 47, 0.55));
        backdrop-filter: blur(6px);
        border: 1px solid rgba(0, 212, 255, 0.28);
        box-shadow: 0 0 14px rgba(0, 212, 255, 0.10), inset 0 0 22px rgba(0, 60, 120, 0.18);
        color: #e5e7eb; font-size: 13px; line-height: 1.6;
      }
      /* 四角 HUD 括号（复用 theme.css hud-panel 的实现） */
      #hud::before, #hud::after {
        content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 4px;
      }
      #hud::before {
        background:
          linear-gradient(#00d4ff, #00d4ff) left 5px top 5px / 10px 2px,
          linear-gradient(#00d4ff, #00d4ff) left 5px top 5px / 2px 10px,
          linear-gradient(#00d4ff, #00d4ff) right 5px bottom 5px / 10px 2px,
          linear-gradient(#00d4ff, #00d4ff) right 5px bottom 5px / 2px 10px;
        background-repeat: no-repeat;
      }
      #hud::after {
        background:
          linear-gradient(#00d4ff, #00d4ff) right 5px top 5px / 10px 2px,
          linear-gradient(#00d4ff, #00d4ff) right 5px top 5px / 2px 10px,
          linear-gradient(#00d4ff, #00d4ff) left 5px bottom 5px / 10px 2px,
          linear-gradient(#00d4ff, #00d4ff) left 5px bottom 5px / 2px 10px;
        background-repeat: no-repeat;
      }
      #hud h1 { font-size: 14px; font-weight: 600; color: #00d4ff; letter-spacing: .04em; margin-bottom: 2px; }
      #status { color: #9ca3af; }
      #ikerr { color: #30ff90; }
      #tip {
        position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
        color: #5d7392; font-size: 12px; letter-spacing: .03em;
      }
      /* ===== 关节控制面板（玻璃拟态：blur16 + 1px 半透明边框 + 绿色强调）===== */
      :root { --jp-acc: #2ee584; --jp-acc-warn: #ffb454; }
      #jpanel {
        position: fixed; right: 16px; top: 50%; transform: translateY(-50%);
        width: 264px; max-height: 92vh; overflow-y: auto; z-index: 10;
        padding: 16px 16px 14px; border-radius: 6px;
        background: linear-gradient(180deg, rgba(13, 42, 79, 0.88), rgba(10, 26, 47, 0.78));
        backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(0, 212, 255, 0.26);
        box-shadow: 0 0 16px rgba(0, 212, 255, 0.08), 0 12px 40px rgba(0, 0, 0, 0.35), inset 0 0 24px rgba(0, 60, 120, 0.15);
        scrollbar-width: thin; scrollbar-color: rgba(0,212,255,.20) transparent;
        animation: jp-in .4s cubic-bezier(.22, 1, .36, 1);
      }
      @keyframes jp-in {
        from { opacity: 0; transform: translateY(-50%) translateX(14px); }
        to   { opacity: 1; transform: translateY(-50%) translateX(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #jpanel, .jp-dot { animation: none; }
      }
      #jpanel::-webkit-scrollbar { width: 6px; }
      #jpanel::-webkit-scrollbar-thumb { border-radius: 999px; background: rgba(255,255,255,.14); }
      .jp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .jp-head-tools { display: inline-flex; align-items: center; gap: 7px; }
      .jp-iconbtn {
        width: 26px; height: 26px; padding: 0;
        display: inline-flex; align-items: center; justify-content: center;
        border-radius: 8px; cursor: pointer; color: #8fa0b5;
        background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.10);
        transition: color .15s ease, border-color .15s ease;
      }
      .jp-iconbtn:hover { color: #e6edf6; border-color: rgba(255, 255, 255, 0.22); }
      .jp-iconbtn.jp-off { color: #56637a; }
      .jp-iconbtn svg { pointer-events: none; }
      .jp-iconbtn .jp-eye-off { display: none; }
      .jp-iconbtn.jp-off .jp-eye-on { display: none; }
      .jp-iconbtn.jp-off .jp-eye-off { display: block; }
      .jp-title {
        display: inline-flex; align-items: center; gap: 8px;
        font-size: 13px; font-weight: 600; letter-spacing: .04em; color: #dfe7f3;
      }
      .jp-title::before {
        content: ''; width: 3px; height: 14px; border-radius: 1px;
        background: #00d4ff; box-shadow: 0 0 8px rgba(0, 212, 255, 0.6);
      }
      .jp-mode {
        display: inline-flex; align-items: center; gap: 5px;
        font-size: 11px; color: #9fb4a8; cursor: pointer;
        padding: 3px 9px; border-radius: 999px;
        background: rgba(46, 229, 132, 0.10); border: 1px solid rgba(46, 229, 132, 0.25);
      }
      .jp-dot {
        width: 6px; height: 6px; border-radius: 50%; background: var(--jp-acc);
        animation: jp-pulse 2.2s ease-out infinite;
      }
      @keyframes jp-pulse {
        0% { box-shadow: 0 0 0 0 rgba(46, 229, 132, 0.5); }
        70%, 100% { box-shadow: 0 0 0 6px rgba(46, 229, 132, 0); }
      }
      @keyframes jp-pulse-warn {
        0% { box-shadow: 0 0 0 0 rgba(255, 180, 84, 0.5); }
        70%, 100% { box-shadow: 0 0 0 6px rgba(255, 180, 84, 0); }
      }
      .jp-mode.jp-manual { background: rgba(255,180,84,.10); border-color: rgba(255,180,84,.30); color: #d8b58c; }
      .jp-mode.jp-manual .jp-dot { background: var(--jp-acc-warn); animation-name: jp-pulse-warn; }
      .jp-rows { display: flex; flex-direction: column; gap: 11px; padding-bottom: 12px; }
      .jp-row { padding: 3px 6px; margin: 0 -6px; border-radius: 8px; transition: background .12s ease; }
      .jp-row:hover { background: rgba(255, 255, 255, 0.035); }
      .jp-row-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
      .jp-jname { font-size: 12px; color: #9aa7ba; }
      .jp-angles { font-variant-numeric: tabular-nums; font-size: 12px; display: inline-flex; gap: 7px; align-items: baseline; }
      .jp-cur { color: #7b8aa0; } /* 深底对比度 ≥4.5:1（12px 小字必需） */
      .jp-tgt { color: #7df0bd; font-weight: 600; }
      .jp-slider {
        -webkit-appearance: none; appearance: none;
        width: 100%; height: 4px; border-radius: 999px; outline: none; cursor: pointer;
        background: rgba(255, 255, 255, 0.10);
        touch-action: none; /* 触屏上把手势给滑条，别判给面板滚动 */
      }
      .jp-slider::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 14px; height: 14px; border-radius: 50%;
        background: #eafff5; border: 2px solid var(--jp-acc);
        box-shadow: 0 0 0 3px rgba(46, 229, 132, 0.15);
        transition: box-shadow .15s ease, transform .1s ease;
      }
      .jp-slider::-webkit-slider-thumb:hover { box-shadow: 0 0 0 5px rgba(46, 229, 132, 0.22); }
      .jp-slider:active::-webkit-slider-thumb {
        transform: scale(1.22);
        box-shadow: 0 0 0 6px rgba(46, 229, 132, 0.28);
      }
      .jp-slider::-moz-range-thumb {
        width: 12px; height: 12px; border-radius: 50%;
        background: #eafff5; border: 2px solid var(--jp-acc);
      }
      .jp-slider:focus-visible { outline: 2px solid rgba(46, 229, 132, 0.6); outline-offset: 4px; }
      .jp-grip { border-top: 1px solid rgba(255, 255, 255, 0.07); padding-top: 11px; }
      .jp-grip-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
      .jp-grip-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
      .jp-btn {
        font: inherit; font-size: 12px; padding: 7px 0; border-radius: 9px; cursor: pointer;
        color: #b9c4d4; background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.10);
        transition: border-color .15s ease, color .15s ease, background .15s ease, transform .08s ease;
      }
      .jp-btn:hover { border-color: rgba(255, 255, 255, 0.22); color: #e6edf6; }
      .jp-btn:active { transform: scale(.96); }
      .jp-btn.jp-on {
        color: #7df0bd; background: rgba(46, 229, 132, 0.10);
        border-color: rgba(46, 229, 132, 0.45);
      }
      /* 任务/路径区（P4） */
      .jp-wide { width: 100%; margin-bottom: 8px; }
      .jp-pathinfo { font-size: 11px; color: var(--color-fog); font-variant-numeric: tabular-nums; }
      /* 复位 = 改变状态的操作指令，用琥珀色系与绿系开关按钮区分 + 点击确认反馈 */
      .jp-reset {
        width: 100%; margin-top: 8px; padding: 8px 0; border-radius: 9px; cursor: pointer;
        display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        font: inherit; font-size: 12px; color: #ffcf9a;
        background: rgba(255, 180, 84, 0.07); border: 1px solid rgba(255, 180, 84, 0.30);
        transition: border-color .15s ease, color .15s ease, background .15s ease, transform .08s ease;
      }
      .jp-reset:hover { border-color: rgba(255, 180, 84, 0.55); color: #ffe3c2; background: rgba(255, 180, 84, 0.12); }
      .jp-reset:active { transform: scale(.96); }
      .jp-reset.jp-done {
        color: #7df0bd; background: rgba(46, 229, 132, 0.08);
        border-color: rgba(46, 229, 132, 0.45);
      }
    </style>
  </head>
  <body>
    <header id="site-nav"></header>
    <div id="hud">
      <h1>仿真规划 · ReBot B601-DM</h1>
      <div id="status">初始化…</div>
      <div id="ikerr"></div>
    </div>
    <div id="tip">拖动绿球控制机械臂 · 空白处左键旋转视角 · 滚轮缩放</div>
    <aside id="jpanel"></aside>
    <div id="send-modal" role="dialog" aria-modal="true" aria-labelledby="sm-title">
      <div class="sm-card">
        <h3 id="sm-title">⇩ 下发实体臂</h3>
        <p class="sm-sub">将当前验证通过的路径经安全校验下发至 reBot B601-DM 真机执行。</p>
        <ul class="sm-check">
          <li>作业半径 0.8 m 内人员清场</li>
          <li>急停（A+B 双键，≤5ms 切断）已就位</li>
          <li>当前路径已在仿真中验证通过</li>
        </ul>
        <div class="sm-note">真机下发链路将在 P5（FastAPI + WebSocket 桥）接入后开放，当前为界面预览。</div>
        <div class="sm-btns">
          <button type="button" class="jp-btn" id="sm-cancel">取消</button>
          <button type="button" class="jp-btn jp-on" id="sm-confirm">确认下发</button>
        </div>
      </div>
    </div>
    <style>
      #send-modal {
        position: fixed; inset: 0; z-index: 80; display: none;
        align-items: center; justify-content: center;
        background: rgba(4, 6, 10, 0.6); backdrop-filter: blur(4px);
      }
      #send-modal.open { display: flex; }
      .sm-card {
        width: min(400px, calc(100vw - 40px)); padding: 24px; border-radius: 16px;
        background: rgba(15, 20, 30, 0.92); border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }
      .sm-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--color-mist); }
      .sm-sub { font-size: 12.5px; color: var(--color-fog); line-height: 1.7; margin-bottom: 14px; }
      .sm-check { list-style: none; margin-bottom: 14px; }
      .sm-check li {
        font-size: 12.5px; color: #b9c4d4; padding: 7px 10px; border-radius: 8px;
        background: rgba(255, 255, 255, 0.04); margin-bottom: 6px;
      }
      .sm-check li::before { content: '✓ '; color: var(--color-acc); font-weight: 700; }
      .sm-note {
        font-size: 11.5px; color: #ffcf9a; padding: 8px 10px; border-radius: 8px; margin-bottom: 16px;
        background: rgba(255, 180, 84, 0.08); border: 1px solid rgba(255, 180, 84, 0.25);
      }
      .sm-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .sm-btns .jp-btn { padding: 9px 0; font-size: 13px; }
    </style>
    <script type="module" src="/src/sim.ts"></script>
  </body>
</html>
