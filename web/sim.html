<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232ee584'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="仿真规划：浏览器内真 MuJoCo 物理仿真，TCP 拖拽、关节面板、一键夹取演示与路径录制回放。" />
    <title>仿真规划 · 报废电池拆解数字孪生</title>
    <style>
      /* 防首帧白屏的最小基础样式（theme.css 经 JS bundle 注入，首帧前不生效）；完整样式在 src/sim.css */
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #0a1220; }
      body { font-family: 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <header id="site-nav"></header>
    <div id="hud" class="hud-panel">
      <h1>仿真规划 · ReBot B601-DM</h1>
      <div id="status">初始化…</div>
      <div id="ikerr"></div>
    </div>
    <div id="tip">拖动绿球控制机械臂 · 空白处左键旋转视角 · 滚轮缩放</div>
    <aside id="jpanel"></aside>
    <div id="send-modal" role="dialog" aria-modal="true" aria-labelledby="sm-title">
      <div class="sm-card">
        <h3 id="sm-title">⇩ 下发实体臂</h3>
        <p class="sm-sub">将当前验证通过的路径经安全校验下发至 reBot B601-DM 真机执行。</p>
        <ul class="sm-check">
          <li>作业半径 0.8 m 内人员清场</li>
          <li>急停（A+B 双键，≤5ms 切断）已就位</li>
          <li>当前路径已在仿真中验证通过</li>
        </ul>
        <div class="sm-note">真机下发链路将在 P5（FastAPI + WebSocket 桥）接入后开放，当前为界面预览。</div>
        <div class="sm-btns">
          <button type="button" class="jp-btn" id="sm-cancel">取消</button>
          <button type="button" class="jp-btn jp-on" id="sm-confirm">确认下发</button>
        </div>
      </div>
    </div>
    <!-- sm-* 弹窗样式已迁 src/sim.css -->
    <script type="module" src="/src/sim.ts"></script>
  </body>
</html>
