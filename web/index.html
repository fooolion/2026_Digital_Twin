    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="报废电池拆解数字孪生集成机器人遥操作系统——总览工作台：系统状态、三维视口与作业流程。" />
    <title>总览 · 报废电池拆解数字孪生</title>
  </head>
  <body>
    <header id="site-nav"></header>
    <div class="ambient" aria-hidden="true">
      <div class="grid-bg"></div>
      <div class="orb orb-b"></div>
    </div>

    <h1 class="sr-only">总览工作台</h1>
    <main class="page-shell cockpit">
      <!-- 左栏（单侧栏）：系统状态 → 性能指标 → 场景配置 → 当前任务 -->
      <aside class="cp-side">
        <section class="hud-panel hud-card cp-card" id="sys-card">
          <h2 class="hud-title">系统状态</h2>
          <ul class="stat-list" id="stat-list"></ul>
        </section>
        <section class="hud-panel hud-card cp-card">
          <h2 class="hud-title">性能指标</h2>
          <div class="kpis" id="kpi-list"></div>
        </section>
        <section class="hud-panel hud-card cp-card">
          <h2 class="hud-title">场景配置</h2>
          <ul class="stat-list kv" id="scene-list"></ul>
        </section>
        <section class="hud-panel hud-card cp-card" id="task-card">
          <h2 class="hud-title">当前任务</h2>
          <p class="task-state"><span class="lamp"></span><b id="task-name">演示待命</b></p>
          <p class="t-mid" id="task-desc">仿真工作台的自动夹取演示已就绪，等待操作员进入。</p>
        </section>
      </aside>

      <!-- 右侧：三维视口（官方真机 URDF；完整仿真进入②） -->
      <section class="cp-center">
        <div id="cockpit-3d" aria-label="机械臂三维预览视口"></div>
        <div class="vp-tag">3D 视口 · 预览模式（左键旋转 · 右键平移 · 滚轮缩放）</div>
        <div class="vp-actions">
          <a class="btn-solid" href="sim.html">进入仿真规划 →</a>
          <a class="btn-ghost" href="live.html">运行监控</a>
        </div>
      </section>

      <!-- 底部：四步工作流进度（对应顶部导航①-④） -->
      <footer class="cp-flow hud-panel">
        <div class="flow-bar" id="flow-bar"></div>
      </footer>
    </main>

    <script type="module" src="/src/home.ts"></script>
  </body>
</html>
